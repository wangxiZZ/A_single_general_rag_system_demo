[project]
name = "rag-kb"
version = "0.1.0"
description = "通用 RAG 知识库服务：文档解析、向量/关键词/图谱三路召回、基于证据的回答，并以 MCP + Skill 接入 Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pymilvus>=2.5,<3",
    "neo4j>=5.25",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "lxml>=5.3",
    "jieba>=0.42",
    "anyio>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
rag-kb = "rag_kb.main:run"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "mcp_server", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# E501：行长由 formatter 控制，注释中允许保留较长的设计说明
# RUF001/002/003：本项目注释与文档使用中文全角标点（，。：）是刻意为之，
# 它们不是拼写歧义，关掉这三条避免把中文排版当成缺陷
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 需要真实容器（Postgres/Milvus/Neo4j）的集成测试",
    "e2e: 端到端流程测试",
]
