# =============================================================================
# 通用 RAG 知识库服务 — 全部必要服务
#
#   docker compose up -d            # 启动 app + postgres + milvus(etcd/minio) + neo4j
#   docker compose ps               # 等 health 全部变 healthy
#   curl localhost:8000/readyz      # 四项依赖全绿即可开始
#
# 资源占用参考（空闲态）：postgres ~120MB / etcd ~60MB / minio ~200MB /
# milvus standalone ~1.5GB / neo4j ~800MB / app ~150MB，合计约 3GB。
# Docker Desktop 建议分配 ≥ 8GB 内存。
# =============================================================================

name: rag-kb

services:
  postgres:
    image: postgres:16-alpine
    container_name: ragkb-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-rag}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-rag_local_pw}
      POSTGRES_DB: ${PG_DB:-ragkb}
      # 中文排序与大小写不敏感比较都用不上，保持默认 C locale 最省事
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-rag} -d ${PG_DB:-ragkb}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---- Milvus standalone 依赖：etcd(元数据) + minio(对象存储) ----
  etcd:
    # 3.5.x 任意补丁版对 Milvus 等价。官方示例用 v3.5.16，但该镜像在 quay.io，
    # 国内网络常在中途 TLS 断连；这里用 3.5 线的 v3.5.5，若你本地已有其他
    # 3.5.x 版本可直接改 tag，无需重新拉取。
    image: quay.io/coreos/etcd:v3.5.5
    container_name: ragkb-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - etcddata:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: ragkb-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - miniodata:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: ragkb-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HTTP_PORT:-9091}:9091"
    volumes:
      - milvusdata:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # 首次启动要建 collection 元数据与索引目录，start_period 给足 90s
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.25-community
    container_name: ragkb-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-ragkb_neo4j_pw}
      # 单机 DEMO 显式限制堆与页缓存，避免 JVM 默认按物理内存放大占用
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-ragkb_neo4j_pw} 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragkb-app
    init: true
    environment:
      APP_NAME: ${APP_NAME:-rag-kb}
      APP_ENV: ${APP_ENV:-dev}
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 容器内路径固定 /data，宿主机目录由 DATA_DIR 决定（见 volumes）
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}

      PG_DSN: postgresql://${PG_USER:-rag}:${PG_PASSWORD:-rag_local_pw}@postgres:5432/${PG_DB:-ragkb}
      PG_POOL_MIN: ${PG_POOL_MIN:-1}
      PG_POOL_MAX: ${PG_POOL_MAX:-8}

      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-chunk_vec}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ragkb_neo4j_pw}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}

      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-90}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-4}

      EMBED_BASE_URL: ${EMBED_BASE_URL:-https://maas.qianwenaiapi.com/compatible-mode/v1}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-qwen3.7-text-embedding-flash}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-16}
      EMBED_MAX_CONCURRENCY: ${EMBED_MAX_CONCURRENCY:-4}
      EMBED_TIMEOUT_S: ${EMBED_TIMEOUT_S:-60}

      VLM_ENABLED: ${VLM_ENABLED:-true}
      VLM_BASE_URL: ${VLM_BASE_URL:-https://maas.qianwenaiapi.com/compatible-mode/v1}
      VLM_API_KEY: ${VLM_API_KEY:-}
      VLM_MODEL: ${VLM_MODEL:-qwen3-vl-plus}
      VLM_MAX_CONCURRENCY: ${VLM_MAX_CONCURRENCY:-2}
      VLM_TIMEOUT_S: ${VLM_TIMEOUT_S:-90}

      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-320}
      CHUNK_OVERLAP_RATIO: ${CHUNK_OVERLAP_RATIO:-0.15}
      PARENT_MAX_TOKENS: ${PARENT_MAX_TOKENS:-1200}
      CHARS_PER_TOKEN: ${CHARS_PER_TOKEN:-1.5}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-20}
      FUSION_RRF_K: ${FUSION_RRF_K:-60}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_TIMEOUT_S: ${RERANK_TIMEOUT_S:-60}
      QA_MAX_CONTEXT_TOKENS: ${QA_MAX_CONTEXT_TOKENS:-6000}
      GRAPH_MAX_HOPS: ${GRAPH_MAX_HOPS:-2}
      GRAPH_SEED_LIMIT: ${GRAPH_SEED_LIMIT:-8}
      GRAPH_NEIGHBOR_LIMIT: ${GRAPH_NEIGHBOR_LIMIT:-50}
      HYBRID_WEIGHT_VECTOR: ${HYBRID_WEIGHT_VECTOR:-1.0}
      HYBRID_WEIGHT_KEYWORD: ${HYBRID_WEIGHT_KEYWORD:-1.0}
      HYBRID_WEIGHT_GRAPH: ${HYBRID_WEIGHT_GRAPH:-1.0}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ${DATA_DIR:-./data}:/data
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  etcddata:
  miniodata:
  milvusdata:
  neo4jdata:
